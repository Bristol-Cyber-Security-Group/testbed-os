name: rust-test

on: [pull_request, workflow_dispatch]

jobs:
  run-cargo-test:
    name: Cargo Test
    runs-on: [self-hosted]

    container:
      image: rust:latest
      options: --user root

    steps:
      - run: apt-get update && apt-get install libvirt-dev git -y
      # rather than use the checkout action, just pull the repo inside the container to avoid spilling out
      # the change of the directory to root since this container runs as root inside
      - run: git clone https://github.com/${{ github.repository }} /tmp/testbed
      - run: cd /tmp/testbed/kvm-compose && cargo test
