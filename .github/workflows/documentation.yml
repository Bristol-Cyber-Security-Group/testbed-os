name: documentation

on:
  pull_request:
  workflow_dispatch:
  push:
    branches:
      - main
      - develop

permissions:
  contents: write

jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v3
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Rust dependencies
      - run: |
            cargo install mdbook 
