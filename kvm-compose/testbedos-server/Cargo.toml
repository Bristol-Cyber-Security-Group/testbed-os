[package]
name = "testbedos-server"
version = "1.1.0"
edition = "2021"

[lib]
name = "testbedos_lib"
path = "src/lib.rs"

[[bin]]
name = "testbedos-server"
path = "src/server.rs"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
axum = { version = "0.8.4", features = ["macros", "ws"] }
axum-extra = { version = "0.10.1", features = ["erased-json", "typed-header"] }
futures-util = { workspace = true }
tokio = { workspace = true}
tower-http = { version = "0.6.6", features = ["cors", "normalize-path", "fs"] }
tower-layer = "0.3.2"
tracing = { workspace = true }
tracing-appender = "0.2.3"
tracing-subscriber = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml = { workspace = true }
anyhow = { workspace = true }
kvm-compose = { path = "../kvm-compose" }
kvm-compose-schemas = { path = "../kvm-compose-schemas" }
service-clients = { path = "../service-clients" }
chrono = "0.4.26"
reqwest = { workspace = true }
clap = { workspace = true }
tokio-cron-scheduler = "0.14.0"
regex = "1.10.2"
csv = "1.3.0"
tera = { workspace = true }
sysinfo = "0.35.2"
virt = { workspace = true }
glob = "0.3.1"
nix = { workspace = true }
async-trait = { workspace = true }
