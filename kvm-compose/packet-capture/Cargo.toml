[package]
name = "packet-capture"
version = "0.1.0"
edition = "2024"

[dependencies]
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "macros"] }
anyhow = { workspace = true }
pcap = { version = "2.3.0", features = ["capture-stream"] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
futures = { workspace = true}
rand = "0.9.2"


# The following is to separate the binary version of this to have a clap CLI frontend and etherparse,
# otherwise it can just be used as a library in the test of the testbed code

[features]
cli-binary = ["clap", "etherparse"]

[dependencies.clap]
version = "4.5.41"
features = ["derive"]
optional = true

[dependencies.etherparse]
version = "0.19.0"
optional = true

[[bin]]
name = "testbedos-tcpdump"
path = "src/main.rs"
required-features = ["cli-binary"]
