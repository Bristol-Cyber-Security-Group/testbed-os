[workspace]
members = [
    "kvm-compose",
    "testbedos-server",
    "kvm-compose-schemas",
    "service-clients",
    "kvm-compose-cli",
    "packet-capture",
]

resolver = "2"

[workspace.dependencies]
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.19", features = ["env-filter"] }
futures = "0.3.31"
futures-util = { version = "0.3.31", default-features = false, features = ["sink", "std"] }
tokio = { version = "1.46.1", features = ["full"] }
tokio-tungstenite = "0.27.0"
reqwest = {version = "0.12.22", features = ["blocking", "default-tls", "json", "stream"], default-features = false}
serde = {version = "1.0.219", features = ["derive"]}
serde_json = "1.0.140"
clap = {version = "4.5.41", features = ["derive"]}
anyhow = "1.0.98"
virt = {version = "0.3.2" }
tera = "1.20.0"
serde_yaml = "0.8"
lazy_static = "1.4.0"
thiserror = "2.0.12"
async-trait = "0.1.74"
nix = { version = "0.30.1", features = ["user", "fs"] }
chrono = {  version = "0.4.41", features = ["serde"] }

[profile.dev.package."*"]
# options to reduce debug mode size
# optimise dependencies in debug mode
opt-level = 3
# disable debug symbols on dependencies in debug mode
debug = false

[profile.dev]
# project code with no optimisations and enable debug symbols
debug = true
opt-level = 0
