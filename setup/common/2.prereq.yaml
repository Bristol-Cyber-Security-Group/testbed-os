---
- name: Install Pre-Requisites and Libvirt
  hosts: all
  become: true
  tasks:
  - name: Include variables based on OS
    include_vars: "{{ lookup('first_found', {'files': ['../vars/{{ ansible_os_family }}/{{ ansible_distribution_major_version }}/main.yaml'], 'paths': ['.']}) }}"
  - name: Install via Aptitude
    apt:
      name: "{{prereq_packages}}"
      state: latest
      update_cache: yes

  - name: Confirm LibVirt is installed
    ansible.builtin.debug: 
      msg: "LibVirt is already installed"
    when: libvrt_check.stat.exists