---
- name: Build and Deploy Documentation
  hosts: all
  vars:
    user_name: "{{ ansible_user_id }}"

  tasks:

    - name: Ensure /var/lib/testbedos/assets directory exists
      file:
        path: /var/lib/testbedos/assets
        state: directory
        mode: '0755'
      become: yes

    - name: Ensure documentation is built and deployed
      block:

        - name: Clean previous build artifacts
          file:
            path: "{{ item }}"
            state: absent
          loop:
            - build
            - /var/lib/testbedos/assets/documentation
          become: yes

        - name: Create build directory
          file:
            path: build
            state: directory
            mode: '0755'
          become: yes

        - name: Build man pages with Sphinx
          shell: | 
            source /home/{{ user_name }}/.bashrc
            /home/{{ user_name }}/.local/bin/poetry  run sphinx-build -M man docs build
          args:
            chdir: "../.."
          environment:
            PATH: "{{ ansible_env.PATH }}:{{ lookup('env', 'HOME') }}/.pyenv/shims:{{ lookup('env', 'HOME') }}/.pyenv/bin"
          become: yes

        - name: Build HTML documentation with Sphinx
          shell: |
            source /home/{{ user_name }}/.bashrc
            /home/{{ user_name }}/.local/bin/poetry  run sphinx-build -M html docs build
          args:
            chdir: "../.."
          environment:
            PATH: "{{ ansible_env.PATH }}:{{ lookup('env', 'HOME') }}/.pyenv/shims:{{ lookup('env', 'HOME') }}/.pyenv/bin"
          become: yes

        - name: Create documentation target directory
          file:
            path: /var/lib/testbedos/assets/documentation
            state: directory
            mode: '0755'
          become: yes

        - name: Copy HTML documentation to target directory
          copy:
            src: build/html/
            dest: /var/lib/testbedos/assets/documentation/
            owner: root
            group: root
            mode: '0644'
            remote_src: yes
          become: yes

    - name: Check if documentation exists
      ansible.builtin.stat:
        path: /var/lib/testbedos/assets/documentation/index.html
      register: sphinx_docs

    - name: Confirm if the documentation has been built
      ansible.builtin.debug:
        msg: "The documentation has been successfully built and deployed."
      when: sphinx_docs.stat.exists
