---
- name: Ensure PyEnv and Python 3.10.5 are Installed
  hosts: all
  tasks:

  - name: Install PyEnv
    shell: |
      curl https://pyenv.run | bash
    args:
      creates: ~/.pyenv/bin/pyenv
    when:  not pyenv_check.stat.exists

  - name: Ensure PyEnv is in PATH
    blockinfile:
      path: ~/.bashrc
      block: |
        export PYENV_ROOT="$HOME/.pyenv"
        command -v pyenv >/dev/null || export PATH="$PYENV_ROOT/bin:$PATH"
        eval "$(pyenv init --path)"
        eval "$(pyenv init -)"
    when:  not pyenv_check.stat.exists

  - name: Check if Python 3.10.5 is installed via PyEnv
    shell: |
      ~/.pyenv/bin/pyenv versions --bare
    register: pyenv_versions
    changed_when: false

  - name: Install Python 3.10.5 using PyEnv
    shell: |
      ~/.pyenv/bin/pyenv install 3.10.5
    when:  "'3.10.5' not in pyenv_versions.stdout"

  - name: Confirm Python 3.10.5 installation
    debug:
      msg: "Python 3.10.5 has already been installed via PyEnv"
    when:  "'3.10.5' in pyenv_versions.stdout"