- name: Install Privacy Tools
hosts: all
vars_prompt:
  - name: "install_privacy_tools"
    prompt: "Would you like to install the Privacy Tools packages? (Yes/No)"
    private: no
tasks:

  - name: Check if Privacy Tools are Installed
    ansible.builtin.stat:
      path: /var/lib/testbedos/tools/frida_tools_venv
    register: privacy_tools_check
    when: install_privacy_tools | bool

  - name: Install PRrivacy Tools if not already installed
    shell: |
      ./setup.sh
    args:
      chdir: "../../util/privacy_tools/" 
      creates: /var/lib/testbedos/tools/frida_tools_venv
    when: not privacy_tools_check.stat.exists and install_privacy_tools | bool

  - name: Confirm if Textual User Interface has been installed
    ansible.builtin.debug:
      msg: "Privacy Tools have already been installed"
    when: privacy_tools_check.stat.exists and install_privacy_tools | bool

- name: Configure Host File
hosts: all
vars_prompt:
  - name: "configure_host_file"
    prompt: "Would you like to configure your Testbed-OS installation automatically? (Yes/No)"
    private: no
tasks:

  - name: Check if host file is present
    ansible.builtin.stat:
      path: /var/lib/testbedos/config/host.json
    register: hostfile_check
    when: configure_host_file | bool

  - name: Read the actual host file content
    ansible.builtin.slurp:
      path: /var/lib/testbedos/config/host.json
    register: actual_hostfile
    when: hostfile_check.stat.exists and configure_host_file | bool

  - name: Define expected host file content
    set_fact:
      expected_hostfile: |
        {
          "ip": "10.50.0.1",
          "user": "{{ ansible_user_id }}",
          "identity_file": "/home/{{ ansible_user_id }}/.ssh/id_ed25519",
          "testbed_nic": "eth0",
          "main_interface": "{{ ansible_default_ipv4.interface }}",
          "is_main_host": true,
          "ovn": {
            "chassis_name": "main",
            "bridge": "br-int",
            "encap_type": "geneve",
            "encap_ip": "10.50.0.1",
            "main_ovn_remote": "unix:/usr/local/var/run/ovn/ovnsb_db.sock",
            "client_ovn_remote": null,
            "bridge_mappings": [
              [
                "public",
                "br-ex",
                "172.16.1.1/24"
              ]
            ]
          }
        }
    when: hostfile_check.stat.exists and configure_host_file | bool

  - name: Convert expected host file content to JSON string
    set_fact:
      expected_hostfile_json: "{{ expected_hostfile | to_json }}"
    when: hostfile_check.stat.exists and configure_host_file | bool

  - name: Create or update host file with expected content
    ansible.builtin.copy:
      content: "{{ expected_hostfile_json }}"
      dest: /var/lib/testbedos/config/host.json
    when: not hostfile_check.stat.exists and not (actual_hostfile.content | b64decode | from_json == expected_hostfile_json | from_json)  and (configure_host_file | bool)

  - name: Compare host file content with expected content
    ansible.builtin.debug:
      msg: "Host file exists and its content matches expected content"
    when: hostfile_check.stat.exists and (actual_hostfile.content | b64decode | from_json == expected_hostfile_json | from_json)  and (configure_host_file | bool)