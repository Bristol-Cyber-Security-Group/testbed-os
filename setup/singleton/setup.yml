---
- name: Check if all are installed and get confirmation if user would like to proceed. 
  hosts: all
  tasks:
  - name: Check if LibVirt is installed
    ansible.builtin.stat:
      path: /usr/bin/virsh
    register: libvrt_check

  - name: Check if OVS is installed
    ansible.builtin.stat:
      path: /usr/local/bin/ovs-vsctl
    register: ovs_check

  - name: Check if OVN is installed
    ansible.builtin.stat:
      path: /usr/local/bin/ovn-nbctl
    register: ovn_check

  - name: Check if Docker is installed
    ansible.builtin.stat:
      path: /usr/bin/docker
    register: docker_check

  - name: Check if sdkmanager is installed
    stat:
      path: /opt/android-sdk/cmdline-tools/latest/bin/sdkmanager
    register: sdkmanager_check

  - name: Check if Rust is installed
    ansible.builtin.stat:
      path: ~/.cargo/bin/rustc
    register: rust_check

  - name: Check if PyEnv is installed
    ansible.builtin.stat: 
      path: ~/.pyenv/bin/pyenv
    register: pyenv_check

  - name: Check if Poetry is installed
    ansible.builtin.stat: 
      path: ~/.local/bin/poetry
    register: poetry_check

  - name: Which packages are installed
    ansible.builtin.debug:
      msg:
      - "LibVirt Installed: '{{ libvrt_check.stat.exists }}'"
      - "OVS Installed: '{{ ovs_check.stat.exists }}'"
      - "OVN Installed: '{{ ovn_check.stat.exists }}'"
      - "Docker Installed: '{{ docker_check.stat.exists }}'"
      - "Android SDK Installed: '{{ sdkmanager_check.stat.exists }}'"
      - "Rust Installed: '{{ rust_check.stat.exists }}'"
      - "PyEnv Installed: '{{ pyenv_check.stat.exists }}'"
      - "Poetry Installed: '{{ poetry_check.stat.exists }}'"




- name: Install Pre-Requisites and Libvirt
  hosts: all
  become: true
  vars_prompt:
    - name: "install_prereq"
      prompt: "Would you like to install the libvrt package? (Yes/No)"
      private: no
  tasks:

  - name: Install via Aptitude
    apt:
      name: 
      - libvirt-dev 
      - libssl-dev 
      - gcc 
      - make 
      - zlib1g 
      - zlib1g-dev
      - libssl-dev
      - libbz2-dev
      - libsqlite3-dev 
      - libffi-dev 
      - libncurses5 
      - libncurses5-dev
      - libncursesw5
      - libreadline-dev 
      - lzma 
      - liblzma-dev 
      - libbz2-dev 
      - libtool 
      - autoconf
      - git 
      - pip 
      - python3.10-venv
      - qemu-kvm 
      - libvirt-daemon-system 
      - libvirt-clients
      - libnss-libvirt
      - genisoimage
      - virt-manager
      state: latest
      update_cache: yes
    when: install_prereq | bool

  - name: Confirm LibVirt is installed
    ansible.builtin.debug: 
      msg: "LibVirt is already installed"
    when: install_prereq | bool and libvrt_check.stat.exists

- name: Install OVN and OVS
  hosts: all
  vars_prompt:
    - name: "install_ovn"
      prompt: "Would you like to install the OVN and OVS packages? (Yes/No)"
      private: no
  tasks:

  - name: Check if OVS is installed
    ansible.builtin.stat:
      path: /usr/local/bin/ovs-vsctl
    register: ovs_check

  - name: Check if OVN is installed
    ansible.builtin.stat:
      path: /usr/local/bin/ovn-nbctl
    register: ovn_check


  - name: Clone OVN from GitHub
    git:
      repo: "https://github.com/ovn-org/ovn.git"
      dest: "/tmp/ovn"
      version: "v24.03.1"
    when: not ovs_check.stat.exists or not ovn_check.stat.exists and install_ovn | bool

  - name: Compile and Install OVN and OVS
    shell: |
      cd /tmp/ovn
      git submodule update --init
      ./boot.sh
      cd ovs
      ./boot.sh
      ./configure
      make
      sudo make install
      cd ..
      ./configure
      make
      sudo make install
    become: yes
    when: not ovs_check.stat.exists or not ovn_check.stat.exists and install_ovn | bool

  - name: Report if OVS And OVN are installed
    debug:
      msg: "OVS and OVN already exist on this machine"
    when: ovs_check.stat.exists and ovn_check.stat.exists and install_ovn | bool

- name: Install Docker
  hosts: all
  vars_prompt:
    - name: "install_docker"
      prompt: "Would you like to install the Docker packages? (Yes/No)"
      private: no
  tasks:

  - name: Gather installed package facts
    package_facts:
      manager: apt
    become: yes

  - name: Ensure necessary packages are installed
    apt:
      name:
        - ca-certificates
        - curl
        - gnupg
      state: present
    become: yes
    when: "'docker-ce' not in ansible_facts.packages and install_docker | bool"

  - name: Create /etc/apt/keyrings directory
    file:
      path: /etc/apt/keyrings
      state: directory
      mode: '0755'
    become: yes
    when: "'docker-ce' not in ansible_facts.packages and install_docker | bool"

  - name: Add Docker's official GPG key
    ansible.builtin.command: |
      curl -fsSL https://download.docker.com/linux/ubuntu/gpg | gpg --dearmor -o /etc/apt/keyrings/docker.gpg
    become: yes
    when: "'docker-ce' not in ansible_facts.packages and install_docker | bool"

  - name: Set permissions for Docker's GPG key
    file:
      path: /etc/apt/keyrings/docker.gpg
      mode: '0644'
    become: yes
    when: "'docker-ce' not in ansible_facts.packages  and install_docker | bool"

  - name: Add Docker APT repository
    ansible.builtin.command: |
      echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/docker.gpg] https://download.docker.com/linux/ubuntu $(. /etc/os-release && echo $VERSION_CODENAME) stable" | tee /etc/apt/sources.list.d/docker.list > /dev/null
    become: yes
    when: "'docker-ce' not in ansible_facts.packages  and install_docker | bool"

  - name: Update APT package index
    apt:
      update_cache: yes
    become: yes
    when: "'docker-ce' not in ansible_facts.packages  and install_docker | bool"

  - name: Install Docker packages
    apt:
      name:
        - docker-ce
        - docker-ce-cli
        - containerd.io
        - docker-buildx-plugin
        - docker-compose-plugin
        - docker-compose
      state: present
    become: yes
    when: "'docker-ce' not in ansible_facts.packages  and install_docker | bool"

  - name: Confirm Docker is installed
    ansible.builtin.debug: 
      msg: "Docker is already installed"
    when: "'docker-ce' in ansible_facts.packages  and install_docker | bool"

- name: Install Android SDK
  hosts: all
  vars_prompt:
    - name: "install_sdk"
      prompt: "Would you like to install the Android SDK packages? (Yes/No)"
      private: no
  tasks:

  - name: Check if sdkmanager is installed
    stat:
      path: /opt/android-sdk/cmdline-tools/latest/bin/sdkmanager
    register: sdkmanager_check

  - name: Ensure necessary packages are installed
    apt:
      name:
        - openjdk-17-jdk
        - android-tools-adb
        - unzip
        - wget
      state: present
    become: yes
    when: not sdkmanager_check.stat.exists and install_sdk | bool

  - name: Create Android SDK directory
    file:
      path: /opt/android-sdk/cmdline-tools/
      state: directory
      mode: '0755'
    become: yes
    when: not sdkmanager_check.stat.exists and install_sdk | bool

  - name: Change ownership of Android SDK directory
    file:
      path: /opt/android-sdk/
      state: directory
      owner: "{{ ansible_user_id }}"
      recurse: yes
    become: yes
    when: not sdkmanager_check.stat.exists and install_sdk | bool

  - name: Download Android SDK Command-Line Tools
    get_url:
      url: https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
      dest: /opt/android-sdk/cmdline-tools/tools.zip
    when: not sdkmanager_check.stat.exists and install_sdk | bool

  - name: Unzip Android SDK Command-Line Tools
    unarchive:
      src: /opt/android-sdk/cmdline-tools/tools.zip
      dest: /opt/android-sdk/cmdline-tools/
      remote_src: yes
    when: not sdkmanager_check.stat.exists and install_sdk | bool

  - name: Rename cmdline-tools directory to latest
    command: mv /opt/android-sdk/cmdline-tools/cmdline-tools /opt/android-sdk/cmdline-tools/latest
    when: not sdkmanager_check.stat.exists and install_sdk | bool

  - name: Remove the downloaded zip file
    file:
      path: /opt/android-sdk/cmdline-tools/tools.zip
      state: absent
    when: not sdkmanager_check.stat.exists and install_sdk | bool

  - name: Add Android SDK to PATH and set environment variables
    lineinfile:
      path: ~/.bashrc
      line: |
        export PATH=$PATH:/opt/android-sdk/cmdline-tools/latest/bin
        export ANDROID_HOME=/opt/android-sdk/
        export ANDROID_SDK_ROOT=/opt/android-sdk/
      create: yes
      state: present
    when: not sdkmanager_check.stat.exists and install_sdk | bool

  - name: Source .bashrc to update PATH
    shell: source ~/.bashrc
    args:
      executable: /bin/bash
    when: not sdkmanager_check.stat.exists and install_sdk | bool

  - name: Accept Android SDK licenses
    shell: yes | /opt/android-sdk/cmdline-tools/latest/bin/sdkmanager --licenses
    when: not sdkmanager_check.stat.exists and install_sdk | bool

  - name: Install Android SDK components
    shell: echo y | /opt/android-sdk/cmdline-tools/latest/bin/sdkmanager --install "emulator" "platform-tools"
    when: not sdkmanager_check.stat.exists and install_sdk | bool

  - name: Create platforms directory
    file:
      path: /opt/android-sdk/platforms
      state: directory
      mode: '0755'
    become: yes
    when: not sdkmanager_check.stat.exists and install_sdk | bool

  - name: Confirm Android SDK is installed
    ansible.builtin.debug: 
      msg: "Android SDK is already installed"
    when: install_sdk | bool and sdkmanager_check.stat.exists

- name: Ensure Rust is installed
  hosts: all
  vars_prompt:
    - name: "install_rust"
      prompt: "Would you like to install the Rust packages? (Yes/No)"
      private: no
  tasks:
  - name: Check if Rust is installed
    ansible.builtin.stat:
       path: ~/.cargo/bin/rustc
    register: rust_check

  - name: Install Rust using RustUp
    shell: |
      curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
    args:
      creates: ~/.cargo/bin/rustc  
    when: not rust_check.stat.exists and install_rust | bool

  - name: Check if rust is in PATH
    lineinfile: 
      path: ~/.bashrc
      line: 'export PATH="$HOME/.cargo/bin:$PATH"'

  - name: Rust is installed
    debug:
      msg: "Rust has already been installed"
    when: rust_check.stat.exists and install_rust | bool

- name: Ensure PyEnv is Installed and run it
  hosts: all
  vars_prompt:
    - name: "install_pyenv"
      prompt: "Would you like to install the PyEnv and Python 3.10.5 packages? (Yes/No)"
      private: no
  tasks:
    
  - name: Check if PyEnv is installed
    ansible.builtin.stat: 
      path: ~/.pyenv/bin/pyenv
    register: pyenv_check
  
  - name: Install PyEnv
    shell: |
      curl https://pyenv.run | bash
    args:
      creates: ~/.pyenv/bin/pyenv
    when: not pyenv_check.stat.exists and install_pyenv | bool

  - name: Ensure PyEnv is in PATH
    blockinfile:
      path: ~/.bashrc
      block: |
        export PYENV_ROOT="$HOME/.pyenv"
        command -v pyenv >/dev/null || export PATH="$PYENV_ROOT/bin:$PATH"
        eval "$(pyenv init -)"
    when: not pyenv_check.stat.exists and install_pyenv | bool

  - name: Install Python 3.10.5 using PyEnv
    shell: |
     ~/.pyenv/bin/pyenv install 3.10.5
    args:
      creates: ~/.pyenv/shims/python3.10
    when: install_pyenv | bool and install_pyenv | bool
 
  - name: Confirm if PyEnv exists
    debug:
      msg: "PyEnv exists, we recommend you ensure Python3.10.5 is installed and both PyEnv and Python are in the PATH"
    when: pyenv_check.stat.exists and install_pyenv | bool

- name: Ensure Poetry is installed
  hosts: all
  vars_prompt:
    - name: "install_poetry"
      prompt: "Would you like to install the Poetry packages? (Yes/No)"
      private: no
  tasks:

  - name: Check if Poetry is installed
    ansible.builtin.stat: 
      path: ~/.local/bin/poetry
    register: poetry_check

  - name: Install Poetry
    shell: | 
      curl -sSL https://install.python-poetry.org | python3 -
    args:
      creates: ~/.local/bin/poetry
    when: not poetry_check.stat.exists and install_poetry | bool

  - name: Ensure Poetry is in PATH
    lineinfile:
      path: ~/.bashrc
      line: export PATH=$PATH:/home/$USER/.local/bin
    when: not poetry_check.stat.exists and install_poetry | bool

  - name: Confirm if Poetry exists
    debug:
      msg: "Poetry is already installed"
    when: poetry_check.stat.exists and install_poetry | bool

- name: Ensure User is in Libvirt Group
  hosts: all
  vars_prompt:
    - name: "configure_libvrt"
      prompt: "Would you like to automatically configure your LibVirt Installation? (Yes/No)"
      private: no
  vars:
    user_name: "{{ansible_user_id}}"
  tasks: 

   - name: Check if user is in libvirt group
     command: getent group libvirt
     register: libvirt_group

   - name: Add user to libvirt group
     user:
       name: "{{ user_name }}"
       groups: libvirt
       append: yes
     when:  user_name not in libvirt_group.stdout and configure_libvrt | bool
     become: true

   - name: Restart libvirt system
     systemd:
       name: libvirtd
       state: restarted
       enabled: yes
     when: user_name not in libvirt_group.stdout and configure_libvrt | bool
     become: true

   - name: Confirm libvirt user is in the group
     debug:
       msg: "{{ user_name }} is in the libvirt user group"
     when: user_name in libvirt_group.stdout and configure_libvrt | bool

- name: Confirm Completion of Pre-Requisites
  hosts: all
  tasks:
   - name: Announcement
     debug:
       msg: "All pre-requisites for the set up process should now be installed. Unexpected errors in the steps ahead can be attributed to missing installations and/or dependencies not being listed in PATH"


- name: Check if all dependencies and Testbed binaries are installed.
  hosts: all
  tasks:

  - name: Check if Poetry has installed its dependencies
    shell: |
      poetry check
    args:
      chdir: "../.."
    register: poetry_check_install
    ignore_errors: yes

  - name: Which packages are installed
    ansible.builtin.debug:
      msg:
      - "Poetry Packages Installed: '{{ poetry_check_install.rc == 0 }}'"
      - "OVS Installed: '{{ ovs_check.stat.exists }}'"
