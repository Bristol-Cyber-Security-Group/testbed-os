- name: Check Status
  import_playbook: ../common/1.status.yml


- name: Install Pre-Requisites and Libvirt
  hosts: all
  become: true
  vars_prompt:
    - name: "install_prereq"
      prompt: "Would you like to install the libvrt package? (Yes/No)"
      private: no
  tasks:

  - name: Convert install_prereq to boolean
    set_fact:
      install_prereq_bool: "{{ (install_prereq | lower) in ['yes', 'y', 'true'] }}"


  - name: Install via Aptitude
    apt:
      name: 
      - libvirt-dev 
      - libssl-dev 
      - gcc 
      - make 
      - zlib1g 
      - zlib1g-dev
      - libssl-dev
      - libbz2-dev
      - libsqlite3-dev 
      - libffi-dev 
      - libncurses5 
      - libncurses5-dev
      - libncursesw5
      - libreadline-dev 
      - lzma 
      - liblzma-dev 
      - libbz2-dev 
      - libtool 
      - autoconf
      - git 
      - pip 
      - python3.10-venv
      - qemu-kvm 
      - libvirt-daemon-system 
      - libvirt-clients
      - libnss-libvirt
      - genisoimage
      - virt-manager
      state: latest
      update_cache: yes
    when: install_prereq_bool

  - name: Confirm LibVirt is installed
    ansible.builtin.debug: 
      msg: "LibVirt is already installed"
    when: install_prereq_bool and libvrt_check.stat.exists

- name: Install OVN and OVS
  hosts: all
  vars_prompt:
    - name: "install_ovn"
      prompt: "Would you like to install the OVN and OVS packages? (Yes/No)"
      private: no
  tasks:

  - name: Convert install_ovn to boolean
    set_fact:
      install_ovn_bool: "{{ (install_ovn | lower) in ['yes', 'y', 'true'] }}"

  - name: Check if OVS is installed
    ansible.builtin.stat:
      path: /usr/local/bin/ovs-vsctl
    register: ovs_check
    when: install_ovn_bool

  - name: Check if OVN is installed
    ansible.builtin.stat:
      path: /usr/local/bin/ovn-nbctl
    register: ovn_check
    when: install_ovn_bool


  - name: Clone OVN from GitHub
    git:
      repo: "https://github.com/ovn-org/ovn.git"
      dest: "/tmp/ovn"
      version: "v24.03.1"
    when: install_ovn_bool and (not ovs_check.stat.exists or not ovn_check.stat.exists)

  - name: Compile and Install OVN and OVS
    shell: |
      cd /tmp/ovn
      git submodule update --init
      ./boot.sh
      cd ovs
      ./boot.sh
      ./configure
      make
      sudo make install
      cd ..
      ./configure
      make
      sudo make install
    become: yes
    when: install_ovn_bool and (not ovs_check.stat.exists or not ovn_check.stat.exists)

  - name: Report if OVS And OVN are installed
    debug:
      msg: "OVS and OVN already exist on this machine"
    when: install_ovn_bool and ovs_check.stat.exists and ovn_check.stat.exists

- name: Install Docker
  hosts: all
  vars_prompt:
    - name: "install_docker"
      prompt: "Would you like to install the Docker packages? (Yes/No)"
      private: no
  tasks:

  - name: Convert install_docker to boolean
    set_fact:
      install_docker_bool: "{{ (install_docker | lower) in ['yes', 'y', 'true'] }}"

  - name: Gather installed package facts
    package_facts:
      manager: apt
    become: yes
    when: install_docker_bool

  - name: Install Docker using shell script
    shell: |
      #!/bin/bash
      set -e

      # Update the apt package index and install packages to allow apt to use a repository over HTTPS
      apt-get update
      apt-get install -y ca-certificates curl gnupg

      # Add Docker’s official GPG key
      install -m 0755 -d /etc/apt/keyrings
      curl -fsSL https://download.docker.com/linux/ubuntu/gpg | gpg --dearmor -o /etc/apt/keyrings/docker.gpg
      chmod a+r /etc/apt/keyrings/docker.gpg

      # Use the following command to set up the repository
      echo \
        "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/docker.gpg] https://download.docker.com/linux/ubuntu \
        $(lsb_release -cs) stable" | tee /etc/apt/sources.list.d/docker.list > /dev/null

      # Update the apt package index again
      apt-get update

      # Install Docker Engine, containerd, and Docker Compose
      apt-get install -y docker-ce docker-ce-cli containerd.io docker-buildx-plugin docker-compose-plugin

    become: yes
    when: "install_docker_bool and 'docker-ce' not in ansible_facts.packages"

  - name: Confirm Docker is installed
    ansible.builtin.debug:
      msg: "Docker is already installed"
    when: "install_docker_bool and 'docker-ce' in ansible_facts.packages"



- name: Install Android SDK
  hosts: all
  vars_prompt:
    - name: "install_sdk"
      prompt: "Would you like to install the Android SDK packages? (Yes/No)"
      private: no
  tasks:

  - name: Convert install_sdk to boolean
    set_fact:
      install_sdk_bool: "{{ (install_sdk | lower) in ['yes', 'y', 'true'] }}"

  - name: Check if sdkmanager is installed
    stat:
      path: /opt/android-sdk/cmdline-tools/latest/bin/sdkmanager
    register: sdkmanager_check
    when: install_sdk_bool

  - name: Ensure necessary packages are installed
    apt:
      name:
        - openjdk-17-jdk
        - android-tools-adb
        - unzip
        - wget
      state: present
    become: yes
    when: install_sdk_bool and not sdkmanager_check.stat.exists

  - name: Create Android SDK directory
    file:
      path: /opt/android-sdk/cmdline-tools/
      state: directory
      mode: '0755'
    become: yes
    when: install_sdk_bool and not sdkmanager_check.stat.exists

  - name: Change ownership of Android SDK directory
    file:
      path: /opt/android-sdk/
      state: directory
      owner: "{{ ansible_user_id }}"
      recurse: yes
    become: yes
    when: install_sdk_bool and not sdkmanager_check.stat.exists

  - name: Download Android SDK Command-Line Tools
    get_url:
      url: https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
      dest: /opt/android-sdk/cmdline-tools/tools.zip
    when: install_sdk_bool and not sdkmanager_check.stat.exists

  - name: Unzip Android SDK Command-Line Tools
    unarchive:
      src: /opt/android-sdk/cmdline-tools/tools.zip
      dest: /opt/android-sdk/cmdline-tools/
      remote_src: yes
    when: install_sdk_bool and not sdkmanager_check.stat.exists

  - name: Rename cmdline-tools directory to latest
    command: mv /opt/android-sdk/cmdline-tools/cmdline-tools /opt/android-sdk/cmdline-tools/latest
    when: install_sdk_bool and not sdkmanager_check.stat.exists

  - name: Remove the downloaded zip file
    file:
      path: /opt/android-sdk/cmdline-tools/tools.zip
      state: absent
    when: install_sdk_bool and not sdkmanager_check.stat.exists

  - name: Add Android SDK to PATH and set environment variables
    lineinfile:
      path: ~/.bashrc
      line: |
        export PATH=$PATH:/opt/android-sdk/cmdline-tools/latest/bin
        export ANDROID_HOME=/opt/android-sdk/
        export ANDROID_SDK_ROOT=/opt/android-sdk/
      create: yes
      state: present
    when: install_sdk_bool and not sdkmanager_check.stat.exists

  - name: Source .bashrc to update PATH
    shell: source ~/.bashrc
    args:
      executable: /bin/bash
    when: install_sdk_bool and not sdkmanager_check.stat.exists

  - name: Accept Android SDK licenses
    shell: yes | /opt/android-sdk/cmdline-tools/latest/bin/sdkmanager --licenses
    when: install_sdk_bool and not sdkmanager_check.stat.exists

  - name: Install Android SDK components
    shell: echo y | /opt/android-sdk/cmdline-tools/latest/bin/sdkmanager --install "emulator" "platform-tools"
    when: install_sdk_bool and not sdkmanager_check.stat.exists

  - name: Create platforms directory
    file:
      path: /opt/android-sdk/platforms
      state: directory
      mode: '0755'
    become: yes
    when: install_sdk_bool and not sdkmanager_check.stat.exists

  - name: Confirm Android SDK is installed
    ansible.builtin.debug: 
      msg: "Android SDK is already installed"
    when: install_sdk_bool and sdkmanager_check.stat.exists

- name: Ensure Rust is installed
  hosts: all
  vars_prompt:
    - name: "install_rust"
      prompt: "Would you like to install the Rust packages? (Yes/No)"
      private: no
  tasks:

  - name: Convert install_rust to boolean
    set_fact:
      install_rust_bool: "{{ (install_rust | lower) in ['yes', 'y', 'true'] }}"

  - name: Check if Rust is installed
    ansible.builtin.stat:
       path: ~/.cargo/bin/rustc
    register: rust_check
    when: install_rust_bool

  - name: Install Rust using RustUp
    shell: |
      curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
    args:
      creates: ~/.cargo/bin/rustc  
    when: install_rust_bool and not rust_check.stat.exists

  - name: Check if rust is in PATH
    lineinfile: 
      path: ~/.bashrc
      line: 'export PATH="$HOME/.cargo/bin:$PATH"'
    when: install_rust_bool and not rust_check.stat.exists

  - name: Rust is installed
    debug:
      msg: "Rust has already been installed"
    when: install_rust_bool and rust_check.stat.exists

- name: Ensure PyEnv is Installed and run it
  hosts: all
  vars_prompt:
    - name: "install_pyenv"
      prompt: "Would you like to install the PyEnv and Python 3.10.5 packages? (Yes/No)"
      private: no
  tasks:

  - name: Convert install_pyenv to boolean
    set_fact:
      install_pyenv_bool: "{{ (install_pyenv | lower) in ['yes', 'y', 'true'] }}"

  - name: Check if PyEnv is installed
    ansible.builtin.stat: 
      path: ~/.pyenv/bin/pyenv
    register: pyenv_check
    when: install_pyenv_bool

  - name: Install PyEnv
    shell: |
      curl https://pyenv.run | bash
    args:
      creates: ~/.pyenv/bin/pyenv
    when: install_pyenv_bool and not pyenv_check.stat.exists

  - name: Ensure PyEnv is in PATH
    blockinfile:
      path: ~/.bashrc
      block: |
        export PYENV_ROOT="$HOME/.pyenv"
        command -v pyenv >/dev/null || export PATH="$PYENV_ROOT/bin:$PATH"
        eval "$(pyenv init -)"
    when: install_pyenv_bool and not pyenv_check.stat.exists

  - name: Check if Python 3.10.5 is installed via PyEnv
    shell: |
      ~/.pyenv/bin/pyenv versions --bare
    register: pyenv_versions
    changed_when: false
    when: install_pyenv_bool and pyenv_check.stat.exists

  - name: Install Python 3.10.5 using PyEnv
    shell: |
      ~/.pyenv/bin/pyenv install 3.10.5
    when: install_pyenv_bool and pyenv_check.stat.exists and '3.10.5' not in pyenv_versions.stdout

  - name: Confirm Python 3.10.5 installation and Pyenv installation
    debug:
      msg: "Python 3.10.5 has already been installed installed via PyEnv"
    when: install_pyenv_bool and pyenv_check.stat.exists and '3.10.5' in pyenv_versions.stdout


- name: Ensure Poetry is installed
  hosts: all
  vars_prompt:
    - name: "install_poetry"
      prompt: "Would you like to install the Poetry packages? (Yes/No)"
      private: no
  tasks:

  - name: Convert install_poetry to boolean
    set_fact:
      install_poetry_bool: "{{ (install_poetry | lower) in ['yes', 'y', 'true'] }}"

  - name: Check if Poetry is installed
    ansible.builtin.stat: 
      path: ~/.local/bin/poetry
    register: poetry_check
    when: install_poetry_bool

  - name: Install Poetry
    shell: | 
      curl -sSL https://install.python-poetry.org | python3 -
    args:
      creates: ~/.local/bin/poetry
    when: install_poetry_bool and not poetry_check.stat.exists

  - name: Ensure Poetry is in PATH
    lineinfile:
      path: ~/.bashrc
      line: export PATH=$PATH:/home/$USER/.local/bin
    when: install_poetry_bool and not poetry_check.stat.exists

  - name: Confirm if Poetry exists
    debug:
      msg: "Poetry is already installed"
    when: install_poetry_bool and poetry_check.stat.exists

- name: Ensure User is in Libvirt Group
  hosts: all
  vars_prompt:
    - name: "configure_libvrt"
      prompt: "Would you like to automatically configure your LibVirt Installation? (Yes/No)"
      private: no
  vars:
    user_name: "{{ansible_user_id}}"
  tasks: 


  - name: Convert configure_libvrt to boolean
    set_fact:
      configure_libvrt_bool: "{{ (configure_libvrt | lower) in ['yes', 'y', 'true'] }}"

  - name: Check if user is in libvirt group
    command: getent group libvirt
    register: libvirt_group
    when: configure_libvrt_bool

  - name: Add user to libvirt group
    user:
      name: "{{ user_name }}"
      groups: libvirt
      append: yes
    when:  configure_libvrt_bool and user_name not in libvirt_group.stdout
    become: true

  - name: Restart libvirt system
    systemd:
      name: libvirtd
      state: restarted
      enabled: yes
    when: configure_libvrt_bool and user_name not in libvirt_group.stdout
    become: true

  - name: Confirm libvirt user is in the group
    debug:
      msg: "{{ user_name }} is in the libvirt user group"
    when: configure_libvrt_bool and user_name in libvirt_group.stdout



- name: Use Poetry to install Dependencies
  hosts: all
  vars_prompt:
    - name: "install_poetry_packages"
      prompt: "Would you like to use Poetry to install all Testbed-OS pre-requisite packages? (Yes/No)"
      private: no
  tasks:

  - name: Convert install_poetry_packages to boolean
    set_fact:
      install_poetry_packages_bool: "{{ (install_poetry_packages | lower) in ['yes', 'y', 'true'] }}"

  - name: Check if Poetry has installed its dependencies
    shell: |
      export PYENV_ROOT="$HOME/.pyenv"
      export PATH="$PYENV_ROOT/bin:$HOME/.local/bin:$PATH"
      eval "$(pyenv init --path)"
      eval "$(pyenv init -)"
      poetry run which sphinx-build
    args:
      chdir: "../.."
    register: poetry_check_install
    ignore_errors: yes
    when: install_poetry_packages_bool

  - name: Run Poetry Package Install
    shell: |
      . ~/.bashrc
      export PYENV_ROOT="$HOME/.pyenv"
      export PATH="$PYENV_ROOT/bin:$HOME/.local/bin:$PATH"
      eval "$(pyenv init --path)"
      eval "$(pyenv init -)"
      pyenv global 3.10.5
      poetry env use 3.10.5
      poetry install
    args:
      chdir: "../.."
    when: install_poetry_packages_bool and not poetry_check_install.rc == 0

  - name: Confirm if Poetry has been installed
    ansible.builtin.debug:
      msg: "Poetry Dependencies have already been installed"
    when: install_poetry_packages_bool and poetry_check_install.rc == 0


- name: Build Documentation
  hosts: all
  vars_prompt:
    - name: "build_docs"
      prompt: "Would you like to build documentation? (Yes/No)"
      private: no
  tasks:

  - name: Convert build_docs_packages to boolean
    set_fact:
      build_docs_bool: "{{ (build_docs | lower) in ['yes', 'y', 'true'] }}"

  - name: Check Docs are present
    ansible.builtin.stat:
      path: /var/lib/testbedos/assets/documentation/html/
    register: sphinx_docs
    when: build_docs_bool

  - name: Ensure /var/lib/testbedos/assets directory exists
    file:
      path: /var/lib/testbedos/assets
      state: directory
      mode: '0755'
    become: yes
    when: build_docs_bool and not sphinx_docs.stat.exists

  - name: Build Docs if they are not present
    shell: |
      . ~/.bashrc
      rm -rf build/*
      poetry run sphinx-build -M man docs build
      poetry run sphinx-build -M html docs build
      sudo rm -rf /var/lib/testbedos/assets/documentation/
      sudo mkdir /var/lib/testbedos/assets/documentation/
      sudo cp -r build/html/ /var/lib/testbedos/assets/documentation/
      rm -rf build/*
    args:
      chdir: "../.."
      executable: /bin/bash
    environment:
      PATH: "{{ ansible_env.PATH }}:{{ lookup('env', 'HOME') }}/.pyenv/shims:{{ lookup('env', 'HOME') }}/.pyenv/bin"
    when: build_docs_bool and not sphinx_docs.stat.exists

  - name: Confirm if the Docs has been built
    ansible.builtin.debug:
      msg: "Documentation has already been built"
    when: build_docs_bool and sphinx_docs.stat.exists

- name: Install TUI
  hosts: all
  vars_prompt:
    - name: "install_tui"
      prompt: "Would you like to install the TUI packages? (Yes/No)"
      private: no
  tasks:

  - name: Convert install_tui to boolean
    set_fact:
      install_tui_bool: "{{ (install_tui | lower) in ['yes', 'y', 'true'] }}"

  - name: Check Textual User Interface is installed
    ansible.builtin.stat:
      path: "{{ lookup('env', 'HOME') }}/.local/share/kvm-ui-tui"
    register: tui_check
    when: install_tui_bool

  - name: Create TUI directory
    ansible.builtin.file:
      path: "{{ lookup('env', 'HOME') }}/.local/share/kvm-ui-tui"
      state: directory
      mode: '0755'
    when: install_tui_bool and not tui_check.stat.exists

  - name: Copy TUI.py to TUI directory
    copy:
      src: "{{ playbook_dir }}/../../util/tui/TUI.py"
      dest: "{{ lookup('env', 'HOME') }}/.local/share/kvm-ui-tui/TUI.py"
    when: install_tui_bool and not tui_check.stat.exists

  - name: Create symlink to kvm-ui-tui script
    ansible.builtin.command: ln -sf "{{ lookup('env', 'HOME') }}/.local/share/kvm-ui-tui/TUI.py" "/usr/local/bin/kvm-ui-tui"
    become: yes
    when: install_tui_bool and not tui_check.stat.exists

  - name: Get the location of python from the poetry venv
    shell: |
      export PYENV_ROOT="$HOME/.pyenv"
      export PATH="$PYENV_ROOT/bin:$HOME/.local/bin:$PATH"
      eval "$(pyenv init --path)"
      eval "$(pyenv init -)"
      poetry run which python
    register: poetry_venv_path
    environment:
      PATH: "{{ ansible_env.PATH }}:{{ lookup('env', 'HOME') }}/.pyenv/shims:{{ lookup('env', 'HOME') }}/.pyenv/bin"
    args:
      chdir: "../../util/tui/"
    when: install_tui_bool and not tui_check.stat.exists

  - name: Update the shebang in the kvm-ui-tui script
    ansible.builtin.replace:
      path: "{{ lookup('env', 'HOME') }}/.local/share/kvm-ui-tui/TUI.py"
      regexp: '^#!/usr/bin/env python'
      replace: "#!{{ poetry_venv_path.stdout }}"
    when: install_tui_bool and not tui_check.stat.exists

  - name: Confirm if Textual User Interface has been installed
    ansible.builtin.debug:
      msg: "Textual User Interface has already been installed"
    when: install_tui_bool and tui_check.stat.exists



- name: Install KVM-Compose
  hosts: all
  vars_prompt:
    - name: "install_kvm"
      prompt: "Would you like to install the KVM-Compose packages? (Yes/No)"
      private: no
  tasks:

  - name: Convert install_kvm to boolean
    set_fact:
      install_kvm_bool: "{{ (install_kvm | lower) in ['yes', 'y', 'true'] }}"

  - name: Check if KVM-Compose CLI is Installed
    ansible.builtin.stat:
      path: /usr/local/bin/kvm-compose
    register: kvm_check
    when: install_kvm_bool

  - name: Set default Rust toolchain to stable
    shell: |
      rustup default stable
    environment:
      PATH: "{{ ansible_env.PATH }}:{{ lookup('env', 'HOME') }}/.cargo/bin"
    when: install_kvm_bool and not kvm_check.stat.exists

  - name: Install KVM-Compose CLI if not already installed
    shell: |
      ./install.sh
    args:
      chdir: "../../kvm-compose/kvm-compose-cli/"
      creates: /usr/local/bin/kvm-compose
      executable: /bin/bash
    environment:
      PATH: "{{ ansible_env.PATH }}:{{ lookup('env', 'HOME') }}/.pyenv/shims:{{ lookup('env', 'HOME') }}/.pyenv/bin:{{ lookup('env', 'HOME') }}/.cargo/bin"
    become: yes
    when: install_kvm_bool and not kvm_check.stat.exists

  - name: Confirm if KVM-Compose CLI has been installed
    ansible.builtin.debug:
      msg: "KVM-Compose CLI has already been installed"
    when: install_kvm_bool and kvm_check.stat.exists

