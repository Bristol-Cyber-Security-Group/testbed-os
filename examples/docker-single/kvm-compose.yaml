machines:
- name: nginx
  network:
    - switch: sw0
      gateway: 10.0.0.1
      mac: "00:00:00:00:00:01"
      ip: "10.0.0.10"
  docker:
    image: nginx:stable
    env_file: docker.env
    volumes:
      - source: ${PWD}/html  # the schema allows you to reference the project dir as ${PWD}
        target: /usr/share/nginx/html

