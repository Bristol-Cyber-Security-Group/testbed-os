- name: one-off
  network:
    - switch: sw0
      gateway: 10.0.0.1
      mac: "00:00:00:00:00:02"
      ip: "10.0.0.11"
  docker:
    image: nginx:stable
    command: "/bin/bash"
    # command: "curl docker-single-nginx:80"  # assuming the deployment name is "project"


network:
  ovn:
    switches:
      sw0:
        subnet: "10.0.0.0/24"